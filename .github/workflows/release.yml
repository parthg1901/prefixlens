name: Release

# Pushing a tag v<version> publishes that version to npm with trusted publishing (OIDC from this
# workflow, no stored token) and provenance, then creates a GitHub release from its CHANGELOG.md
# section. A version that is already on the registry (the first one, published by hand) is not
# published again and only gets its GitHub release. Nothing is published while package.json has "private": true: the first job fails, and
# every later job depends on it. One-time setup and the release checklist: docs/releasing.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag, version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Not private, tag equals the package.json version, CHANGELOG.md has its section
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME"

  test-bun:
    name: Test on Bun
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Test the CI example
        working-directory: examples/ci-prefix-test
        run: bun test

  test-node:
    name: Test on Node ${{ matrix.node }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        node: ["22.0.0", "26"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun installs the dev dependencies from bun.lock; the build and the tests run on Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: node scripts/build.mjs
      - name: Test on Node
        run: node --test "test-node/*.test.mjs"
      - name: Check the packed package as a consumer
        run: node scripts/check-package.mjs

  publish:
    name: Publish to npm and create the GitHub release
    needs: [check, test-bun, test-node]
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token npm's trusted publishing exchanges for a short-lived publish credential.
      id-token: write
      # Creating the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Trusted publishing needs Node 22.14 or later and npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or later
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install --global npm@11
          fi
          npm --version
      - name: The same checks, in the job that publishes, writing the release notes
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME" release-notes.md
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: node scripts/build.mjs
      # No NODE_AUTH_TOKEN: npm authenticates with the workflow's OIDC token through the trusted
      # publisher configured for this package on npmjs.com. --provenance makes the publish fail rather
      # than go out without a provenance statement (npm cannot make one from a private repository).
      # The first version is published by hand, before a trusted publisher can exist (docs/releasing.md),
      # and npm refuses the same version twice. When this exact version is already on the registry the
      # step does nothing, so the run goes on to create the GitHub release.
      - name: Publish, unless this version is already on the registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "prefixlens@$version" version 2>/dev/null)" = "$version" ]; then
            echo "prefixlens@$version is already on the registry: not publishing again"
          else
            npm publish --provenance --access public
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "prefixlens ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
